<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d">
<title id="t">今日宜运动，阳光下的快乐远足</title><desc id="d">细腻手绘插画：戴蓝帽子、背黄色背包的孩子在草地小路上跑步，身边有一只欢快的小狗。明亮的蓝色天空、绿草和黄色阳光，保留彩铅绘本的自然纹理与深色描边。</desc>
<defs>
